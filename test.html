<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตรวจระบบ LIFF</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;margin:0;padding:16px;background:#f3f5f7;color:#1f2933;font-size:15px;line-height:1.5}
  h1{font-size:19px;margin:0 0 12px}
  .row{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .row b{display:block}
  .ok{border-left:6px solid #2b8a3e}.bad{border-left:6px solid #c92a2a}.info{border-left:6px solid #1c7ed6}
  pre{white-space:pre-wrap;word-break:break-all;background:#f1f3f5;padding:8px;border-radius:8px;font-size:12.5px;margin:6px 0 0}
  .hint{color:#c92a2a;margin-top:6px}
</style>
</head>
<body>
<h1>🔎 ตรวจการเชื่อมต่อ LIFF → Apps Script</h1>
<div id="out"></div>
<script>
const LIFF_ID = '2011772311-Ptw8b18f';
const API_URL = 'https://script.google.com/macros/s/AKfycbwsFrGPo-9hZIvaSKnukqOIQZ3uQgvkdhPW5Bq6lfi1BPyRFoVF_XqP1WcxNbsCjIAudg/exec';

const out = document.getElementById('out');
function add(state, title, detail, hint) {
  const d = document.createElement('div');
  d.className = 'row ' + state;
  d.innerHTML = `<b>${state === 'ok' ? '✅' : state === 'bad' ? '❌' : 'ℹ️'} ${title}</b>`;
  if (detail) { const p = document.createElement('pre'); p.textContent = detail; d.appendChild(p); }
  if (hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = '👉 ' + hint; d.appendChild(h); }
  out.appendChild(d);
}

(async () => {
  // 1) โหลด LIFF SDK
  if (typeof liff === 'undefined') { add('bad', '1. โหลด LIFF SDK ไม่ได้', '', 'ตรวจอินเทอร์เน็ตของมือถือ แล้วเปิดใหม่'); return; }
  add('ok', '1. โหลด LIFF SDK ได้');

  // 2) liff.init
  try { await liff.init({ liffId: LIFF_ID }); }
  catch (e) { add('bad', '2. liff.init ไม่สำเร็จ', String(e && (e.message || e)), 'ตรวจ Endpoint URL ของ LIFF ต้องเป็น https://natdanaijenff.github.io/repair/'); return; }
  add('ok', '2. liff.init สำเร็จ', `เปิดในแอป LINE: ${liff.isInClient()} | ล็อกอินแล้ว: ${liff.isLoggedIn()} | OS: ${liff.getOS()}`);
  if (!liff.isLoggedIn()) { add('info', 'กำลังพาไปล็อกอิน LINE...'); liff.login({ redirectUri: location.href }); return; }

  // 3) ID token
  const tok = liff.getIDToken(), dec = liff.getDecodedIDToken();
  if (!tok || !dec) {
    add('bad', '3. ไม่มี ID token', '', 'ไปที่ LINE Developers → LINE Login channel → แท็บ LIFF → แก้ LIFF app → Scopes ติ๊ก "openid" แล้วบันทึก จากนั้นปิดหน้านี้แล้วเปิดใหม่');
    return;
  }
  const minsLeft = Math.round((dec.exp * 1000 - Date.now()) / 60000);
  const aud = String(dec.aud), want = LIFF_ID.split('-')[0];
  add(aud === want && minsLeft > 0 ? 'ok' : 'bad', '3. มี ID token',
    `channel ใน token (aud): ${aud}\nchannel ที่ควรเป็น: ${want}\nLINE userId: ${String(dec.sub).slice(0, 6)}...\nหมดอายุในอีก: ${minsLeft} นาที`,
    aud !== want ? 'LIFF ID ไม่ตรงกับ channel ของ token' : minsLeft <= 0 ? 'token หมดอายุ ปิดหน้านี้แล้วเปิดใหม่จากแอป LINE' : '');

  // 4) เรียก Apps Script
  let res, text;
  try {
    res = await fetch(API_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ liff: 1, idToken: tok, req: { action: 'boot' } })
    });
    text = await res.text();
  } catch (e) {
    add('bad', '4. เรียก Apps Script ไม่ได้ (ส่งไม่ถึง)', String(e && (e.message || e)),
      'ตรวจว่า Deploy แบบ "ผู้มีสิทธิ์เข้าถึง: ทุกคน" และลิงก์ /exec ถูกต้อง');
    return;
  }
  let data = null; try { data = JSON.parse(text); } catch {}
  if (!data) {
    add('bad', `4. Apps Script ตอบกลับไม่ใช่ JSON (HTTP ${res.status})`, text.slice(0, 400),
      'ถ้าเห็นคำว่า Authorization / ให้สิทธิ์: รัน setup ใน Apps Script แล้วอนุญาต จากนั้น Deploy เวอร์ชันใหม่ | ถ้าเห็นหน้า Google Sign-in: ตั้งผู้มีสิทธิ์เข้าถึงเป็น "ทุกคน"');
    return;
  }
  add('ok', `4. Apps Script ตอบกลับ (HTTP ${res.status})`, JSON.stringify(data).slice(0, 400));

  // 5) แปลผล
  const err = String(data.error || '');
  if (data.ok) {
    add('ok', data.data && data.data.liffUid ? '5. 🎉 เชื่อมต่อสำเร็จ และผูก LINE แล้ว (เข้าใช้ได้ทันที)' : '5. 🎉 เชื่อมต่อสำเร็จ (ยังไม่ผูก LINE)');
  } else if (err.includes('ACCESS')) {
    add('ok', '5. 🎉 เชื่อมต่อสำเร็จ', 'ระบบขอรหัสเข้าใช้ระบบ เป็นเรื่องปกติของผู้ใช้ที่ยังไม่ผูก LINE',
      '');
    add('info', 'ถ้าหน้าหลักยังเข้าไม่ได้ ให้กด "ล้างข้อมูลในเครื่อง" หรือปิดแอป LINE แล้วเปิดใหม่ เพราะอาจยังจำหน้าเก่าไว้');
  } else if (err.includes('LIFF_OFF')) {
    add('bad', '5. Apps Script ยังไม่มี LIFF_ID', err, 'ใส่ 2011772311-Ptw8b18f ในแถว LIFF_ID คอลัมน์ B แท็บ "ตั้งค่า" ของ Sheet ระบบแจ้งซ่อม');
  } else if (err.includes('LIFF_AUTH')) {
    add('bad', '5. LINE ปฏิเสธ token', err, 'LIFF_ID ในแท็บ "ตั้งค่า" ต้องเป็น 2011772311-Ptw8b18f ตรงทุกตัว (ห้ามมีเว้นวรรค) และมีแถว LIFF_ID แถวเดียว');
  } else {
    add('bad', '5. Apps Script แจ้ง error', err, 'ส่งภาพหน้าจอนี้ให้ผู้ดูแลระบบ');
  }
})();
</script>
</body>
</html>
