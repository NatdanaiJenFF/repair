<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://api.line.me">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface-2:#E6EDEF; --line:#D3DEE1;
  --ink:#0E2230; --ink-2:#465A66; --ink-3:#798B94;
  --brand:#0B7A83; --brand-ink:#FFFFFF; --brand-soft:#D9EFF0; --brand-deep:#08565C;
  --crit:#C93B30; --crit-soft:#FBE5E2; --warn:#B8760A; --warn-soft:#FBEFD6;
  --ok:#1F7F53; --ok-soft:#DCF1E6; --info:#2A67AD; --info-soft:#E0EBF7;
  --violet:#6450BF; --violet-soft:#EAE6F9; --mute:#6B7C85; --mute-soft:#E7ECEE;
  --shadow:0 1px 2px rgba(14,34,48,.06),0 8px 24px rgba(14,34,48,.06);
  --r:14px; --ff-d:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --ff:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A151B; --surface:#112029; --surface-2:#172B35; --line:#233E4A;
  --ink:#E4EDF0; --ink-2:#A3B5BD; --ink-3:#6F8590;
  --brand:#3DB5BD; --brand-ink:#04252A; --brand-soft:#11363B; --brand-deep:#7FD3D8;
  --crit:#FF7B6F; --crit-soft:#3A1D1A; --warn:#F0B34A; --warn-soft:#37290F;
  --ok:#4DC68A; --ok-soft:#123224; --info:#72A9EE; --info-soft:#152A43;
  --violet:#A797F0; --violet-soft:#241F45; --mute:#8FA2AB; --mute-soft:#1C2D36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A151B; --surface:#112029; --surface-2:#172B35; --line:#233E4A;
  --ink:#E4EDF0; --ink-2:#A3B5BD; --ink-3:#6F8590;
  --brand:#3DB5BD; --brand-ink:#04252A; --brand-soft:#11363B; --brand-deep:#7FD3D8;
  --crit:#FF7B6F; --crit-soft:#3A1D1A; --warn:#F0B34A; --warn-soft:#37290F;
  --ok:#4DC68A; --ok-soft:#123224; --info:#72A9EE; --info-soft:#152A43;
  --violet:#A797F0; --violet-soft:#241F45; --mute:#8FA2AB; --mute-soft:#1C2D36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
h1,h2,h3{font-family:var(--ff-d);text-wrap:balance;margin:0;line-height:1.3}
.mono{font-family:var(--ff-m);font-size:.82em;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:flex;min-height:100%}
.side{display:none}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid transparent}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--ff-d);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink)}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.av{width:32px;height:32px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2);overflow:hidden}
.av.sm{width:24px;height:24px;font-size:10px}
.avbtn{border:0;background:none;padding:0;border-radius:50%}
main{padding:8px 16px 110px;width:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:6px 0;border-radius:10px;position:relative}
.tab[aria-current="page"]{color:var(--brand)}
.tab .badge{top:0;right:calc(50% - 22px)}
.tab.fab{color:var(--brand-ink)}
.tab.fab span.fabc{width:50px;height:50px;border-radius:16px;background:var(--brand);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 45%,transparent)}
.tab.fab em{font-style:normal;color:var(--brand);font-weight:600}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:6px;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{padding:0 8px 18px}
  .navi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;border:0;background:none;text-align:left;color:var(--ink-2);font-weight:500;position:relative}
  .navi:hover{background:var(--surface-2);color:var(--ink)}
  .navi[aria-current="page"]{background:var(--brand-soft);color:var(--brand-deep)}
  .navi .badge{position:static;margin-left:auto;border-color:transparent}
  .side .newbtn{margin:4px 0 12px}
  .side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left}
  .side .me span{min-width:0}.side .me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side .me small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabbar,.topbar .brand,.topbar .avbtn{display:none}
  .topbar{padding:14px 28px}
  main{padding:8px 28px 48px}
}

/* type + blocks */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding-top:6px}
.hello h1{font-size:clamp(22px,4.5vw,30px);font-weight:700}
.hello p{margin:2px 0 0;color:var(--ink-2)}
.sec{display:flex;flex-direction:column;gap:12px}
.sech{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sech h2{font-size:18px;font-weight:600}
.sech .cnt{color:var(--ink-3);font-size:13px}
.sech a,.link{color:var(--brand);font-weight:500;font-size:14px;background:none;border:0;padding:0;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--ff-d);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stat .dot{width:8px;height:8px;border-radius:50%}
.stat.hot{border-color:color-mix(in srgb,var(--crit) 45%,var(--line));background:color-mix(in srgb,var(--crit-soft) 55%,var(--surface))}
.stat.hot b{color:var(--crit)}

/* dept tiles */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dtile{--c:var(--brand);display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;transition:transform .15s,border-color .15s}
.dtile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.dtile b{font-size:14.5px;font-weight:600;line-height:1.3}
.dtile small{color:var(--ink-3);font-size:12px;line-height:1.4}
.dtile[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.dico{--c:var(--brand);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.dico.sm{width:28px;height:28px;border-radius:8px}
.dico.sm .ic{width:16px;height:16px}

/* chips + pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.7}
.t-warn{background:var(--warn-soft);color:var(--warn)}.t-info{background:var(--info-soft);color:var(--info)}
.t-brand{background:var(--brand-soft);color:var(--brand-deep)}.t-violet{background:var(--violet-soft);color:var(--violet)}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-mute{background:var(--mute-soft);color:var(--mute)}.t-crit{background:var(--crit-soft);color:var(--crit)}
.urg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.urg i{width:8px;height:8px;border-radius:50%;background:currentColor}
.u-critical{color:var(--crit)}.u-urgent{color:var(--warn)}.u-normal{color:var(--info)}
.u-critical i{box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 25%,transparent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--crit) 0%,transparent)}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ticket cards */
.tlist{display:grid;gap:10px}
@media (min-width:900px){.tlist.two{grid-template-columns:1fr 1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tcard:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));box-shadow:var(--shadow)}
.tcard.crit{border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.tc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc-top .code{color:var(--ink-3)}
.tc-title{font-weight:600;font-size:15.5px;line-height:1.4}
.tc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:13px;align-items:center}
.tc-meta span{display:inline-flex;align-items:center;gap:5px}
.tc-foot{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-3);font-size:14px}

/* buttons + forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:14px}
.lbl small,.field>label small{font-weight:400;color:var(--ink-3)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.row2{display:grid;gap:14px}
@media (min-width:640px){.row2{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.form{display:flex;flex-direction:column;gap:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.segb small{color:var(--ink-3);font-size:12px;line-height:1.35}
.segb[aria-pressed="true"].u-critical{border-color:var(--crit);background:var(--crit-soft)}
.segb[aria-pressed="true"].u-urgent{border-color:var(--warn);background:var(--warn-soft)}
.segb[aria-pressed="true"].u-normal{border-color:var(--info);background:var(--info-soft)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.addph{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);cursor:pointer;text-align:center;font-size:11.5px;align-content:center;gap:2px}
.addph input{display:none}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.banner .ic{color:var(--warn);margin-top:2px}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.searchbox .inp{padding-left:40px}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow select{flex:1 1 150px;width:auto}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{font-weight:600;font-size:12px;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);letter-spacing:.02em}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface-2)}
td.n{text-align:right;width:84px}th.n{text-align:right}
td .zero{color:var(--ink-3)}
td .hotn{color:var(--crit);font-weight:700}

/* directory */
.dirgrid{display:grid;gap:12px}
@media (min-width:760px){.dirgrid{grid-template-columns:1fr 1fr}}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.dcard header{display:flex;gap:12px;align-items:flex-start}
.dcard header h3{font-size:16px}
.dcard header p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:10px;font-size:14px}
.person .ext{margin-left:auto;color:var(--ink-2)}
.dstats{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.dstats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* notifications */
.nlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.nitem{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.nitem:last-child{border-bottom:0}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:color-mix(in srgb,var(--brand-soft) 55%,var(--surface))}
.nitem .nt{flex:1;min-width:0;font-size:14px}
.nitem .nt b{font-weight:600}
.nitem .nt small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.nitem .ud{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,18,24,.45);z-index:40;animation:fade .2s}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{left:auto;top:0;bottom:0;width:560px;max-height:none;border-radius:0;border-left:1px solid var(--line);animation:side .25s cubic-bezier(.2,.8,.2,1)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes side{from{transform:translateX(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.shead h2{font-size:17px;flex:1;min-width:0}
.sbody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;flex:1;overscroll-behavior:contain}
.sfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.dtitle{font-size:21px;font-weight:700}
.steps{display:flex;gap:4px}
.step{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ink-3);text-align:center}
.step i{height:5px;border-radius:9px;background:var(--surface-2)}
.step.on i{background:var(--brand)}.step.on{color:var(--ink-2)}
.step.cur{color:var(--brand-deep);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.apanel{border:1px solid var(--brand);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--brand-soft) 35%,var(--surface))}
.apanel h3{font-size:15px}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;padding:2px;color:var(--line)}
.stars button.on{color:var(--warn)}
.stars .ic{width:30px;height:30px;fill:currentColor;stroke:none}
.tl{display:flex;flex-direction:column;gap:14px}
.tle{display:flex;gap:10px}
.tle .tlb{flex:1;min-width:0;font-size:14px}
.tle .tlb .who{font-weight:600}
.tle .tlb time{color:var(--ink-3);font-size:12px;margin-left:6px}
.bubble{margin-top:4px;background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.tle.mine .bubble{background:var(--brand-soft)}
.sysdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.sysdot .ic{width:14px;height:14px}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}

/* ---------- notifications ---------- */
function eventText(t,e){
 const who=nm(e.by,t.unit);
 switch(e.kind){
  case 'create':return `<b>${esc(who)}</b> แจ้งซ่อมใหม่ถึง ${esc(dname(t.dept))}`;
  case 'accept':return `<b>${esc(who)}</b> รับงานแล้ว`;
  case 'assign':return `<b>${esc(who)}</b> มอบหมายงานให้ ${esc(nm(e.to))}`;
  case 'start':return `<b>${esc(who)}</b> เริ่มดำเนินการซ่อม`;
  case 'wait':return `<b>${esc(who)}</b> พักงานเพื่อรออะไหล่`;
  case 'resume':return `<b>${esc(who)}</b> กลับมาดำเนินการต่อ`;
  case 'done':return `<b>${esc(who)}</b> แจ้งว่าซ่อมเสร็จแล้ว รอตรวจรับ`;
  case 'transfer':return `<b>${esc(who)}</b> ส่งต่องานจาก ${esc(dname(e.from))} ไป ${esc(dname(e.to))}`;
  case 'collab':return `<b>${esc(who)}</b> ขอความร่วมมือจาก ${esc(dname(e.to))}`;
  case 'close':return `<b>${esc(who)}</b> ตรวจรับและปิดงาน${e.rating?` · ให้ ${e.rating}/5 ดาว`:''}`;
  case 'reopen':return `<b>${esc(who)}</b> แจ้งว่ายังไม่เรียบร้อย ขอให้ดำเนินการต่อ`;
  case 'cancel':return `<b>${esc(who)}</b> ยกเลิกใบแจ้งซ่อม`;
  case 'comment':return `<b>${esc(who)}</b> ส่งข้อความ`;
  case 'follow':return `<b>${esc(who)}</b> แจ้งว่าพบปัญหาเดียวกัน`;
  case 'escalate':return `<b>ระบบ</b> แจ้งหัวหน้างาน: งานเกินเวลารับงาน`;
 }return `<b>${esc(who)}</b> อัปเดตงาน`;
}
const KIND_ICON={follow:'team',escalate:'alert',create:'plus',accept:'check',assign:'user',start:'play',wait:'pause',resume:'play',done:'check',transfer:'forward',collab:'link',close:'star',reopen:'undo',cancel:'x',comment:'chat'};
function notifs(){const out=[];for(const t of S.tickets){if(!relevant(t))continue;for(const e of (t.log||[])){if(e.by===S.uid)continue;out.push({t,e})}}out.sort((a,b)=>b.e.t-a.e.t);return out.slice(0,120)}
const unreadCount=()=>S.uid?notifs().filter(n=>n.e.t>S.lastSeen).length:0;
function checkNew(){const fresh=[];for(const t of S.tickets){if(!relevant(t))continue;for(const e of (t.log||[])){if(e.t>S.bootAt&&e.by!==S.uid&&!S.toasted.has(e.id)){S.toasted.add(e.id);fresh.push({t,e})}}}
 if(!fresh.length)return;fresh.sort((a,b)=>a.e.t-b.e.t).slice(-3).forEach(({t,e})=>toast(eventText(t,e)+(e.text?`: ${esc(e.text.slice(0,80))}`:''),`${t.code} · ${t.title}`,t.id,KIND_ICON[e.kind]));beep();try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch{}}
function toast(html,sub,id,icon='bell'){const el=document.createElement('div');el.className='toast';el.innerHTML=`${I(icon)}<div>${html}${sub?`<small>${esc(sub)}</small>`:''}</div>`;if(id)el.onclick=()=>{openTicket(id);el.remove()};$('#toasts').appendChild(el);setTimeout(()=>el.remove(),6500)}
let actx=null;function soundOn(){return ls.get('sound',true)}
function beep(){if(!soundOn()||!actx)return;try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.13);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.38);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.4)}catch{}}
addEventListener('pointerdown',()=>{if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch{}}else if(actx.state==='suspended')actx.resume().catch(()=>{})},{passive:true});

function patch(el,html){const saved={};el.querySelectorAll('input[id],textarea[id],select[id]').forEach(x=>{if(x.type!=='file')saved[x.id]=x.type==='checkbox'?x.checked:x.value});
 const a=document.activeElement,fid=a&&el.contains(a)?a.id:null;let sel=null;try{if(fid&&a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd]}catch{}
 const sb=el.querySelector('.sbody'),st=sb?sb.scrollTop:0;
 el.innerHTML=html;
 for(const k in saved){const x=el.querySelector('#'+CSS.escape(k));if(x&&!x.hasAttribute('data-fresh')){if(x.type==='checkbox')x.checked=saved[k];else x.value=saved[k]}}
 if(fid){const x=el.querySelector('#'+CSS.escape(fid));if(x){x.focus({preventScroll:true});if(sel)try{x.setSelectionRange(sel[0],sel[1])}catch{}}}
 const nb=el.querySelector('.sbody');if(nb&&sb)nb.scrollTop=st;}

function filtered(){const f=S.filter;const q=f.q.trim().toLowerCase();return S.tickets.filter(t=>{
 if(f.st==='active'&&!ACTIVE.includes(t.status))return false;
 if(f.st==='new'&&t.status!=='new')return false;
 if(f.st==='work'&&!['accepted','working','waiting'].includes(t.status))return false;
 if(f.st==='done'&&t.status!=='done')return false;
 if(f.st==='closed'&&!['closed','cancelled'].includes(t.status))return false;
 if(f.dept&&t.dept!==f.dept&&!(t.collab||[]).includes(f.dept))return false;
 if(f.urg&&t.urgency!==f.urg)return false;
 if(f.scope==='mine'&&t.createdBy!==S.uid&&t.assignee!==S.uid)return false;
 if(f.scope==='dept'&&!inMyDept(t)&&!(me()?.unit&&t.unit===me().unit))return false;
 if(q&&!(`${t.code} ${t.title} ${t.location} ${t.unit} ${t.asset||''} ${t.detail||''}`.toLowerCase().includes(q)))return false;
 return true}).sort((a,b)=>f.st==='new'?byQueue(a,b):byNew(a,b))}

function actionsFor(t){const m=me();if(!canWrite()||!m&&t.createdBy!==S.uid)return[];const A=[];const act=ACTIVE.includes(t.status);if(!act)return A;
 const inD=inMyDept(t)||t.assignee===S.uid;const own=t.createdBy===S.uid;const adm=m?.role==='admin';
 if(inD&&t.status==='new'&&m)A.push(['accept','รับงาน','check',1]);
 if(inD&&t.status==='accepted')A.push(['start','เริ่มซ่อม','play',1]);
 if(inD&&t.status==='waiting')A.push(['resume','ดำเนินการต่อ','play',1]);
 if(inD&&['accepted','working','waiting'].includes(t.status))A.push(['done','ซ่อมเสร็จ','check',t.status==='working'?1:0]);
 if(inD&&['accepted','working'].includes(t.status))A.push(['wait','รออะไหล่','pause',0]);
 if(adm&&inD&&t.status!=='done')A.push(['assign','มอบหมายช่าง','user',0]);
 if(inD&&t.status!=='done')A.push(['transfer','ส่งต่อแผนก','forward',0],['collab','ขอความร่วมมือ','link',0]);
 if((own||adm)&&t.status==='done')A.push(['close','ตรวจรับ / ปิดงาน','star',1],['reopen','ยังไม่เรียบร้อย','undo',0]);
 if((own||adm)&&t.status==='new')A.push(['cancel','ยกเลิกใบงาน','x',0]);
 if(!own&&!inD&&t.status!=='done'&&!(t.followers||[]).includes(S.uid))A.push(['follow','ฉันพบปัญหานี้ด้วย','team',0]);
 return A}

function errMsg(e){const c=String(e?.message||e);if(c.includes('ACCESS'))return['รหัสเข้าใช้ระบบถูกเปลี่ยน','ออกจากระบบแล้วเข้าใหม่ด้วยรหัสล่าสุด'];if(c.includes('TAKEN'))return['งานนี้มีผู้รับไปแล้ว','ระบบอัปเดตข้อมูลล่าสุดให้แล้ว'];if(c.includes('BUSY'))return['ระบบกำลังบันทึกงานอื่นอยู่','รอสักครู่แล้วลองใหม่'];if(c.includes('NO_USER'))return['ไม่พบชื่อผู้ใช้ของคุณ','ออกจากระบบแล้วลงทะเบียนใหม่'];if(c.includes('CLOSED'))return['ใบงานนี้ปิดแล้ว','แก้ไขไม่ได้'];if(c.includes('FOLLOWING'))return['คุณติดตามใบงานนี้อยู่แล้ว','ไม่ต้องกดซ้ำ'];if(c.includes('NET')||c.includes('network'))return['เชื่อมต่อไม่ได้','ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'];return['บันทึกไม่สำเร็จ','ลองใหม่อีกครั้ง']}

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let {width:w,height:h}=img;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=.7,u=c.toDataURL('image/jpeg',q);while(u.length>45000&&q>.25){q-=.1;u=c.toDataURL('image/jpeg',q)}res(u)};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

const locTok=s=>(String(s||'').toLowerCase().match(/[0-9]+[a-z]?|[a-z]{2,}|[฀-๿]{2,}/g)||[]).filter(w=>!['อาคาร','ตึก','ชั้น','ห้อง','เตียง','โซน'].includes(w));
function findDupes(d){if(!d||!d.dept)return[];const loc=locTok(d.location),nums=loc.filter(w=>/^[0-9]/.test(w));const asset=String(d.asset||'').trim().toLowerCase();const since=Date.now()-14*864e5;
 return S.tickets.filter(t=>t.dept===d.dept&&['new','accepted','working','waiting'].includes(t.status)&&t.createdAt>since).map(t=>{let sc=0;
  if(asset&&String(t.asset||'').trim().toLowerCase()===asset)sc+=3;const tl=locTok(t.location);const shared=loc.filter(w=>tl.includes(w));
  if(shared.some(w=>/^[0-9]/.test(w)))sc+=2;if(shared.length>=2)sc+=1;if(nums.length&&tl.filter(w=>/^[0-9]/.test(w)).length&&!shared.some(w=>/^[0-9]/.test(w)))sc-=2;
  const tt=locTok(d.title),ttl=locTok(t.title);if(tt.some(w=>ttl.includes(w)))sc+=1;return{t,sc}}).filter(x=>x.sc>=2).sort((a,b)=>b.sc-a.sc).slice(0,3).map(x=>x.t)}

 S.hx.busy=true;render();
 try{const r=await call('hxMutate',p);hxUpsert(r.item);S.hx.act=null;const n=$('#hx_note');if(n)n.value='';toast('บันทึกแล้ว',x.code,null,'check')}
 catch(e){if(String(e?.message||e).includes('AUTH')){forceRelogin('เซสชันหมดอายุ กรุณาใส่ PIN อีกครั้ง');return}toast(hxErr(e),x.code,null,'alert');if(String(e?.message||e).includes('CLOSED'))loadHx(true)}

/* ---------- server link (Google Apps Script) ---------- */
/* เรียก Apps Script ผ่าน LIFF: ส่ง LINE ID token ไปยืนยันตัวตนทุกครั้ง */
/* token หมดอายุหรือใช้ไม่ได้ → เข้าสู่ระบบ LINE ใหม่ แล้วกลับมาหน้าเดิม */
function liffGoLogin(){ls.set('snap',null);const v=new URLSearchParams(location.search).get('v');try{liff.logout()}catch{}
 if(liff.isInClient())location.replace('https://liff.line.me/'+LIFF_ID+(v?'?v='+encodeURIComponent(v):''));   // เปิด LIFF ใหม่ = ได้ token ใหม่จาก LINE
 else liff.login({redirectUri:location.href})}
function liffReauth(){let last=0;try{last=+sessionStorage.getItem('mr.relogin')||0}catch{}
 try{sessionStorage.setItem('mr.relogin',String(Date.now()))}catch{}
 if(Date.now()-last>60000){liffGoLogin();return}                  // ลองอัตโนมัติ 1 ครั้งต่อนาที
 let el=document.getElementById('relogin');if(!el){el=document.createElement('div');el.id='relogin';document.body.appendChild(el)}  // ถ้ายังไม่ได้ ให้กดเอง
 el.innerHTML=`<div style="position:fixed;inset:0;z-index:9999;background:rgba(15,23,32,.55);display:grid;place-items:center;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center;font-family:inherit">
  <div style="font-size:40px">🔐</div><h2 style="margin:6px 0">เซสชัน LINE หมดอายุ</h2>
  <p style="color:#555;margin:0 0 16px">กดปุ่มด้านล่างเพื่อเข้าสู่ระบบ LINE ใหม่ แล้วใช้งานต่อได้ทันที</p>
  <button id="relogin_btn" style="width:100%;padding:14px;border:0;border-radius:12px;background:#06c755;color:#fff;font:inherit;font-weight:700;font-size:16px">เข้าสู่ระบบ LINE ใหม่</button>
  ${liff.isInClient()?'<p style="color:#888;font-size:13px;margin:12px 0 0">ถ้ายังไม่ได้ ให้กด X ปิดหน้านี้ แล้วกดเมนูในแชต LINE อีกครั้ง</p>':''}</div></div>`;
 el.querySelector('#relogin_btn').onclick=liffGoLogin}
/* เก็บข้อมูลล่าสุดไว้ในเครื่อง ผูกกับบัญชี LINE ที่เปิด (ใช้ข้ามบัญชีไม่ได้) */
function saveSnap(d){if(!S.lu||!d||!d.liffUid)return;ls.set('snap',{lu:S.lu,at:Date.now(),d:{ver:d.ver,members:d.members,tickets:d.tickets,ai:d.ai,line:d.line,liffUid:d.liffUid}})}
async function bootFresh(){try{const r=await call('boot');
  if(r.liffUid&&r.liffUid===S.uid){applyData(r);S.aiOn=!!r.ai;S.lineOn=!!r.line;saveSnap(r);S.dbState='ok';render()}
  else{ls.set('snap',null);location.reload()}}
 catch(e){const m=String(e?.message||e);if(m.includes('LIFF_AUTH'))return;
  if(m.includes('ACCESS')||m.includes('NO_USER')){ls.set('snap',null);location.reload();return}
  S.dbState='err';render()}}
function liffToken(){const t=liff.getAccessToken();if(!t){liffReauth();throw new Error('NET')}return t}
async function call(action,p={}){const req={code:S.code,uid:S.uid,token:S.token,...p,action};let res,d;
 try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({liff:1,accessToken:liffToken(),req}),redirect:'follow'})}catch(e){throw new Error('NET')}
 try{d=await res.json()}catch(e){throw new Error('NET')}
 if(!d.ok){const m=String(d.error||'NET');if(m.includes('LIFF_AUTH'))liffReauth();if(m.includes('LIFF_OFF'))showFatal('ยังไม่ได้ใส่ LIFF_ID ในแท็บ "ตั้งค่า" ของ Google Sheet');throw new Error(m)}
 return d.data}
function applyData(r){Object.values(r.members||{}).forEach(m=>{m.name=String(m.name??'');m.unit=String(m.unit??'');m.ext=String(m.ext??'')});setTimeout(lineLinkedCheck,0);const first=!S.ticketsLoaded;S.members=r.members||{};S.tickets=(r.tickets||[]).sort((a,b)=>b.createdAt-a.createdAt);S.ver=r.ver;S.ticketsLoaded=true;S.membersLoaded=true;S.dbState='ok';if(!first&&S.authed)checkNew()}
let syncing=false,timer=null;
async function sync(force){if(syncing||(!S.code&&!S.liffLinked))return;syncing=true;
 try{const r=await call('sync',{ver:force?0:S.ver});if(!r.same){applyData(r);if(S.liffLinked)saveSnap({...r,liffUid:S.uid,ai:S.aiOn,line:S.lineOn});if(S.uid&&!S.members[S.uid]&&S.authed){S.authed=false;S.login={step:'who',mode:'new',err:'ไม่พบชื่อของคุณในระบบแล้ว กรุณาลงทะเบียนใหม่'}}render()}else if(S.dbState!=='ok'){S.dbState='ok';render()}}
 catch(e){if(String(e?.message||e).includes('ACCESS')){S.authed=false;S.code='';ls.set('code','');S.login={step:'code',mode:'new',err:'รหัสเข้าใช้ระบบถูกเปลี่ยน กรุณาใส่รหัสใหม่'};stopPolling()}else S.dbState='err';render()}
 finally{syncing=false}}
function startPolling(){stopPolling();timer=setInterval(()=>{if(document.visibilityState==='visible')sync()},20000)}
function stopPolling(){if(timer)clearInterval(timer);timer=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.authed)sync()});
function saveFile(name,buf){const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}

/* ---------- login + PIN ---------- */
const pinInput=(id,label,auto)=>`<div class="field"><label for="${id}">${label}</label><input class="inp num lcode" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" ${auto?'autofocus':''}></div>`;
const pinVal=id=>($('#'+id)?.value||'').trim();
const isPin=v=>/^\d{4}$/.test(v);
function renderLogin(){document.querySelector('.app').hidden=true;$('#scrim').hidden=true;$('#sheet').hidden=true;const L=S.login;const el=$('#login');el.hidden=false;
 let h=`<div class="lcard"><div class="brand"><span class="mark">${I('cross')}</span><span><b>ศูนย์แจ้งซ่อม</b><small>ระบบแจ้งซ่อมภายในโรงพยาบาล</small></span></div>`;
 const bz=S.busy?'disabled':'';
 if(L.step==='loading')h+=`<div class="skel" style="height:120px"></div><p class="lmuted">กำลังเชื่อมต่อระบบ...</p>`;
 else if(L.step==='code')h+=`<div><h1>เข้าสู่ระบบ</h1><p class="lmuted">ใส่รหัสเข้าใช้ระบบที่ได้รับจากหัวหน้างานซ่อมบำรุง (ครั้งแรกครั้งเดียว หลังจากนั้นเปิดจาก LINE ได้ทันที)</p></div><div class="field"><label for="l_code">รหัสเข้าใช้ระบบ</label><input class="inp num lcode" id="l_code" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="••••••"></div><button class="btn pri block" data-act="lcode" ${bz}>${S.busy?'กำลังตรวจสอบ...':'ถัดไป'}</button>`;
 else if(L.step==='setpin'){const m=S.members[L.who]||{};h+=`<div><h1>ตั้ง PIN ใหม่</h1><p class="lmuted">${esc(m.name||'')} · ตั้ง PIN ตัวเลข 4 หลักไว้ใช้เข้าสู่ระบบครั้งต่อไป</p></div>${pinInput('l_pin1','PIN ใหม่ 4 หลัก',1)}${pinInput('l_pin2','ยืนยัน PIN อีกครั้ง')}<button class="btn pri block" data-act="lsetpin" ${bz}>${S.busy?'กำลังบันทึก...':'ตั้ง PIN และเข้าใช้งาน'}</button><button class="btn block" data-act="lmode" data-m="pick">ย้อนกลับ</button>`}
 else{const names=Object.entries(S.members).sort((a,b)=>String(a[1].name).localeCompare(String(b[1].name),'th'));const mode=names.length?L.mode:'new';
  h+=`<div><h1>${mode==='pick'?'เข้าสู่ระบบด้วย PIN':'ลงทะเบียนครั้งแรก'}</h1><p class="lmuted">${mode==='pick'?'เลือกชื่อของคุณ แล้วใส่ PIN 4 หลัก':'กรอกข้อมูลและตั้ง PIN 4 หลักสำหรับเข้าสู่ระบบ'}</p></div>${names.length?`<div class="chips"><button class="chip" aria-pressed="${mode==='pick'}" data-act="lmode" data-m="pick">เคยลงทะเบียนแล้ว</button><button class="chip" aria-pressed="${mode==='new'}" data-act="lmode" data-m="new">ลงทะเบียนครั้งแรก</button></div>`:''}`;
  if(mode==='pick')h+=`<div class="field"><label for="l_who">ชื่อของคุณ</label><select class="inp" id="l_who"><option value="">เลือกชื่อ</option>${names.map(([id,m])=>`<option value="${esc(id)}" ${L.who===id?'selected':''}>${esc(m.name)} · ${esc(m.role==='requester'?m.unit:dname(m.dept))}</option>`).join('')}</select></div>${pinInput('l_pin','PIN 4 หลัก')}<button class="btn pri block" data-act="lpick" ${bz}>${S.busy?'กำลังตรวจสอบ...':'เข้าใช้งาน'}</button><p class="lmuted" style="font-size:12.5px">ลืม PIN? แจ้งหัวหน้างานซ่อมบำรุงให้รีเซ็ต แล้วตั้ง PIN ใหม่ได้ทันที</p>`;
  else{const d=S.profDraft||(S.profDraft={name:'',role:'',unit:'',dept:'',ext:''});h+=profileFields(d)+pinInput('l_pin1','ตั้ง PIN 4 หลัก')+pinInput('l_pin2','ยืนยัน PIN อีกครั้ง')+`<button class="btn pri block" data-act="saveprof" ${bz}>${S.busy?'กำลังบันทึก...':'ลงทะเบียนและเข้าใช้งาน'}</button><p id="p_err" class="lerr"></p>`}}
 if(L.err)h+=`<p class="lerr">${esc(L.err)}</p>`;

function authErr(e){const c=String(e?.message||e);if(c.includes('LOCKED'))return 'ใส่ PIN ผิดหลายครั้ง ระบบล็อกชื่อนี้ไว้ 15 นาที';const w=c.match(/WRONG_PIN:(\d+)/);if(w)return `PIN ไม่ถูกต้อง ลองได้อีก ${w[1]} ครั้ง`;if(c.includes('BAD_PIN'))return 'PIN ต้องเป็นตัวเลข 4 หลัก';if(c.includes('ACCESS'))return 'รหัสเข้าใช้ระบบถูกเปลี่ยน';return 'เชื่อมต่อระบบไม่ได้ ลองใหม่อีกครั้ง ['+c.slice(0,40)+']'}
async function loginCode(){const c=($('#l_code')?.value||'').trim();if(!c){S.login.err='กรุณาใส่รหัสเข้าใช้ระบบ';render();return}
 S.code=c;S.busy=true;S.login.err='';render();
 try{const r=await call('boot');ls.set('code',c);applyData(r);S.aiOn=!!r.ai;S.lineOn=!!r.line;if(r.authOk&&S.members[S.uid])enter();else S.login={step:'who',mode:Object.keys(S.members).length?'pick':'new'}}
 catch(e){S.code='';S.login.err=String(e?.message||e).includes('ACCESS')?'รหัสไม่ถูกต้อง ตรวจสอบกับหัวหน้างานอีกครั้ง':'เชื่อมต่อระบบไม่ได้ ลองใหม่อีกครั้ง'}
 finally{S.busy=false;render()}}
function setSession(uid,token){S.uid=uid;S.token=token;ls.set('uid',uid);ls.set('token',token)}
function enter(){S.authed=true;if(S.lu&&S.uid&&S.ticketsLoaded){S.liffLinked=true;saveSnap({ver:S.ver,members:S.members,tickets:S.tickets,ai:S.aiOn,line:S.lineOn,liffUid:S.uid})}if(!S.lastSeen){S.lastSeen=Date.now();S.seenBase=S.lastSeen;ls.set('lastSeen',S.lastSeen)}S.login={step:'code',mode:'new'};S.profDraft=null;S.bootAt=Date.now();startPolling()}
async function loginPick(){const id=$('#l_who')?.value;const pin=pinVal('l_pin');S.login.who=id;
 if(!id){S.login.err='กรุณาเลือกชื่อของคุณ';render();return}if(!isPin(pin)){S.login.err='กรุณาใส่ PIN ตัวเลข 4 หลัก';render();return}
 S.busy=true;S.login.err='';render();
 try{const r=await call('login',{uid:id,pin});setSession(id,r.token);S.busy=false;enter()}
 catch(e){if(String(e?.message||e).includes('NEED_SET')){S.login={step:'setpin',who:id,mode:'pick'}}else{S.login.err=authErr(e)}const x=$('#l_pin');if(x)x.value=''}
 finally{S.busy=false;render()}}
async function loginSetPin(){const a=pinVal('l_pin1'),b=pinVal('l_pin2');if(!isPin(a)){S.login.err='PIN ต้องเป็นตัวเลข 4 หลัก';render();return}if(a!==b){S.login.err='PIN ทั้งสองช่องไม่ตรงกัน';render();return}
 S.busy=true;S.login.err='';render();const id=S.login.who;
 try{const r=await call('setPin',{uid:id,pin:a});setSession(id,r.token);S.busy=false;enter();toast('ตั้ง PIN เรียบร้อย','ใช้ PIN นี้ทุกครั้งที่เข้าสู่ระบบ',null,'check')}
 catch(e){S.login.err=String(e?.message||e).includes('HAS_PIN')?'ชื่อนี้ตั้ง PIN ไว้แล้ว กลับไปเข้าสู่ระบบด้วย PIN':authErr(e)}
 finally{S.busy=false;render()}}
async function logout(){ls.set('snap',null);const tok=S.token;if(tok)call('logout').catch(()=>{});ls.set('uid',null);ls.set('token',null);S.uid=null;S.token=null;S.authed=false;S.sheet=null;S.profDraft=null;S.login={step:'who',mode:'pick'};stopPolling();render();toast('ออกจากระบบแล้ว','ครั้งต่อไปเข้าด้วย PIN 4 หลัก',null,'check')}
function forceRelogin(msg){const who=S.uid;ls.set('token',null);S.token=null;S.authed=false;S.sheet=null;S.login={step:'who',mode:'pick',who,err:msg};stopPolling();render()}
async function changePin(){const o=pinVal('c_old'),a=pinVal('c_new'),b=pinVal('c_new2');const err=m=>{const e=$('#c_err');if(e){e.textContent=m;e.style.color=m.startsWith('✓')?'var(--ok)':'var(--crit)'}};
 if(!isPin(o)||!isPin(a))return err('PIN ต้องเป็นตัวเลข 4 หลัก');if(a!==b)return err('PIN ใหม่ทั้งสองช่องไม่ตรงกัน');
 try{await call('changePin',{old:o,pin:a});['c_old','c_new','c_new2'].forEach(i=>{const x=$('#'+i);if(x)x.value=''});err('✓ เปลี่ยน PIN แล้ว อุปกรณ์อื่นที่ค้างระบบไว้จะต้องเข้าสู่ระบบใหม่')}
 catch(e){const c=String(e?.message||e);err(c.includes('WRONG_OLD')?'PIN เดิมไม่ถูกต้อง':c.includes('AUTH')?'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่':'เปลี่ยน PIN ไม่สำเร็จ')}}
async function resetPin(){const t=$('#r_who')?.value;const out=$('#r_err');if(!t)return;if(S.resetConfirm!==t){S.resetConfirm=t;if(out){out.textContent=`กดอีกครั้งเพื่อยืนยันรีเซ็ต PIN ของ ${S.members[t]?.name||''}`;out.style.color='var(--warn)'}return}
 S.resetConfirm=null;try{await call('resetPin',{target:t});if(out){out.textContent=`✓ รีเซ็ตแล้ว ${S.members[t]?.name||''} ตั้ง PIN ใหม่ได้ที่หน้าเข้าสู่ระบบ`;out.style.color='var(--ok)'}}catch(e){if(out){out.textContent='รีเซ็ตไม่สำเร็จ';out.style.color='var(--crit)'}}}

/* ---------- boot ---------- */
async function boot(){S.login.step='loading';render();
 try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liffReauth();return}
  S.lu=(liff.getContext&&liff.getContext()||{}).userId||'';const snap=S.lu&&ls.get('snap',null);
  if(snap&&snap.lu===S.lu&&snap.d&&snap.d.liffUid){applyData(snap.d);S.aiOn=!!snap.d.ai;S.lineOn=!!snap.d.line;S.liffLinked=true;setSession(snap.d.liffUid,null);enter();render();setInterval(()=>{if(S.authed)render()},60000);bootFresh();return}
  const qv=new URLSearchParams(location.search).get('v');if(qv&&['home','list','new','notif','depts'].includes(qv)){S.view=qv;ls.set('view',qv)}}
 catch(e){S.login={step:'code',mode:'new',err:'เปิดผ่าน LINE ไม่สำเร็จ: '+(e?.message||e)};render();return}
 try{const r=await call('boot');applyData(r);S.aiOn=!!r.ai;S.lineOn=!!r.line;
  if(r.liffUid){S.liffLinked=true;setSession(r.liffUid,null);saveSnap(r);enter()}
  else if(r.authOk&&S.members[S.uid])enter();
  else S.login={step:'who',mode:Object.keys(S.members).length?'pick':'new',who:S.members[S.uid]?S.uid:''}}
 catch(e){const acc=String(e?.message||e).includes('ACCESS'),had=!!S.code;if(acc){S.code='';ls.set('code','')}
  S.login={step:'code',mode:'new',err:acc?(had?'รหัสเข้าใช้ระบบถูกเปลี่ยน กรุณาใส่รหัสใหม่':''):'เชื่อมต่อระบบไม่ได้ ลองโหลดหน้าใหม่อีกครั้ง ['+String(e?.message||e).slice(0,40)+']'}}
 render();setInterval(()=>{if(S.authed)render()},60000)}
if(S.view==='new')S.draft=newDraft();
boot();

</script>
